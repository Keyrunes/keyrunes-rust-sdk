name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Wraps `cargo audit` with the floor that keeps the one documented
      # advisory exception from widening. See .cargo/audit.toml.
      - name: Run security audit
        run: ./scripts/audit.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "axum"
          - "actix"
          - "rocket"
          - "axum,actix"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --verbose
          else
            cargo build --features "${{ matrix.features }}" --verbose
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "axum"
          - "actix"
          - "rocket"
          - "axum,actix"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --verbose
          else
            cargo test --features "${{ matrix.features }}" --verbose
          fi

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The middleware compiles only with its feature enabled, so it is
        # mutated in a pass of its own. See scripts/mutants.sh.
        scope: [core, middleware]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # Coverage proves the lines ran; this proves an assertion would have
      # noticed had they done the wrong thing.
      - name: Run mutation testing
        run: ./scripts/mutants.sh ${{ matrix.scope }}
      - name: Upload the mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ matrix.scope }}
          path: mutants.out/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage and check the threshold
        run: ./scripts/coverage-check.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./lcov.info
          flags: unittests
          name: codecov-umbrella
