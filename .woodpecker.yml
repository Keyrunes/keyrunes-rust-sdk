when:
  event: [push, pull_request]

# Kept in step with .github/workflows/ci.yml and .pre-commit-config.yaml: the
# three run the same gates, so a green commit stays green in either pipeline.
variables:
  - &rust_image rust:1.98

steps:
  - name: Checkout
    image: alpine/git
    commands:
      - git clone $CI_REPO_CLONE_URL .
      - git checkout $CI_COMMIT_SHA

  - name: Rust Setup
    image: *rust_image
    commands:
      - rustup component add rustfmt clippy
      - rustc --version
      - cargo --version

  - name: Format Check
    image: *rust_image
    commands:
      - cargo fmt --all -- --check

  - name: Clippy
    image: *rust_image
    commands:
      - cargo clippy --all-targets --all-features -- -D warnings

  - name: Security Audit
    image: *rust_image
    commands:
      - cargo install cargo-audit --locked
      - ./scripts/audit.sh

  - name: MSRV
    image: *rust_image
    commands:
      - MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
      - test -n "$MSRV"
      - rustup toolchain install "$MSRV" --profile minimal
      - cargo "+$MSRV" check --all-features --all-targets

  - name: Build
    image: *rust_image
    commands:
      - cargo build --all-features --verbose

  - name: Test
    image: *rust_image
    commands:
      - cargo test --all-features --verbose

  - name: Mutation Testing
    image: *rust_image
    commands:
      - cargo install cargo-mutants --locked
      - ./scripts/mutants.sh core
      - ./scripts/mutants.sh middleware

  - name: Coverage
    image: *rust_image
    commands:
      - cargo install cargo-llvm-cov --locked
      - rustup component add llvm-tools-preview
      - ./scripts/coverage-check.sh
    coverage:
      - lcov.info
